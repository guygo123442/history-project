<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>תיק מודיעין 1914</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: a 1914 railway map is the game board; a dark ink HUD on top; scenes open as letters laid over the map. Single deliberate look (paper on a dark desk). */
:root{
  --desk:#221c18;
  --paper:#efe2c4;
  --paper-2:#e2d0a8;
  --paper-3:#f7eed9;
  --ink:#2a2118;
  --ink-soft:#5f4e3b;
  --seal:#8e1c1c;
  --seal-dark:#5e1010;
  --ok:#2f5d34;
  --rule:#b49c72;
  --f-display:"Suez One","Frank Ruhl Libre",Georgia,serif;
  --f-body:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --f-ui:"Rubik",system-ui,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--desk);background-image:radial-gradient(ellipse at 50% -10%,#3a2f28 0%,var(--desk) 65%);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #e0a43a;outline-offset:2px}
.btn{font-family:var(--f-ui);font-weight:500;font-size:16px;background:var(--ink);color:var(--paper);border:none;padding:11px 22px;cursor:pointer;border-radius:2px}
.btn:hover{filter:brightness(1.2)}
.btn.seal{background:var(--seal)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}

/* ---------- start screen ---------- */
.start{background:var(--paper);background-image:radial-gradient(circle at 92% 8%,rgba(120,80,30,.14),transparent 40%),radial-gradient(circle at 4% 96%,rgba(120,80,30,.18),transparent 45%);box-shadow:0 18px 50px rgba(0,0,0,.5);padding:clamp(20px,4vw,48px);border-radius:3px}
.start h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,60px);line-height:1.05;margin:6px 0 10px;text-wrap:balance}
.start .lead{max-width:58ch;margin:0 0 26px;color:var(--ink-soft)}
.start h2{font-family:var(--f-ui);font-size:15px;font-weight:700;letter-spacing:.06em;margin:0 0 10px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:24px}
.role{display:flex;gap:14px;align-items:flex-start;text-align:right;background:var(--paper-3);border:1px solid var(--rule);padding:14px;cursor:pointer;min-width:0}
.role:hover{border-color:var(--ink)}
.role[aria-pressed="true"]{border-color:var(--seal);box-shadow:inset 0 0 0 2px var(--seal)}
.role b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block;line-height:1.2}
.role span{font-size:15px;color:var(--ink-soft);line-height:1.45;display:block;margin-top:4px}
.medal{flex-shrink:0;width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--ink)}
.medal svg{width:26px;height:26px}
.namebox{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.namebox label{display:flex;flex-direction:column;gap:6px;font-family:var(--f-ui);font-size:14px;font-weight:500;flex:1;min-width:200px;max-width:340px}
.namebox input{font-family:var(--f-body);font-size:18px;padding:10px 12px;border:1px solid var(--ink);background:var(--paper-3);color:var(--ink);border-radius:2px}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:3px 3px 0 0}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who .medal{width:42px;height:42px;background:var(--seal);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--seal)}
.who .medal svg{width:20px;height:20px}
.who b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-family:var(--f-ui);font-size:12px;opacity:.75}
.date{font-family:var(--f-ui);font-weight:700;font-size:15px;border:2px solid var(--paper);padding:3px 10px;font-variant-numeric:tabular-nums;transform:rotate(-2deg)}
.cred{display:flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:12px}
.cred i{width:18px;height:18px;border-radius:50%;background:var(--seal);box-shadow:inset 0 -3px 0 var(--seal-dark),0 0 0 1px rgba(239,226,196,.4);display:inline-block}
.cred i.lost{background:transparent;box-shadow:inset 0 0 0 2px rgba(239,226,196,.35)}
.nb-btn{font-family:var(--f-ui);font-size:14px;font-weight:500;background:var(--paper);color:var(--ink);border:none;padding:7px 12px;cursor:pointer;border-radius:2px;font-variant-numeric:tabular-nums}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 300px;background:var(--paper);box-shadow:0 18px 50px rgba(0,0,0,.5);border-radius:0 0 3px 3px}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.map{position:relative;min-width:0;border-inline-end:1px solid var(--rule);direction:ltr}
@media (max-width:820px){.map{border-inline-end:none;border-bottom:1px solid var(--rule)}}
.map svg{display:block;width:100%;height:auto}
.side{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.side p{margin:0;font-size:16px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;border-top:1px solid var(--rule);padding-top:12px}
.log li{display:flex;gap:8px;align-items:baseline}
.log .d{font-family:var(--f-ui);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex-shrink:0;width:52px}

/* svg map styling */
.grat{stroke:#c9b48c;stroke-width:1}
.country{font-family:"Rubik",Arial,sans-serif;font-size:22px;font-weight:700;fill:#bca57b;letter-spacing:.15em}
.sea{font-family:"Frank Ruhl Libre",Georgia,serif;font-style:italic;font-size:17px;fill:#8f8a74}
.rail{fill:none;stroke:var(--ink);stroke-width:2.5}
.ties{fill:none;stroke:var(--ink);stroke-width:9;stroke-dasharray:1.5 9;opacity:.75}
.rail.future,.ties.future{opacity:.22}
.city text{font-family:"Rubik",Arial,sans-serif;font-size:19px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px}
.city .pin{fill:var(--paper-3);stroke:var(--ink);stroke-width:3}
.city.visited .pin{fill:var(--seal);stroke:var(--seal-dark)}
.city .check{fill:none;stroke:var(--paper);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.city.visited .check{display:block}
.city .ring{fill:none;stroke:var(--seal);stroke-width:3;opacity:0}
.city.next{cursor:pointer}
.city.next .ring{opacity:1;animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.city.next .pin{fill:#fff6e0}
.city .hit{fill:transparent}
.city:focus{outline:none}
.city:focus-visible .pin{stroke:#e0a43a;stroke-width:5}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.token{transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.token .disc{fill:var(--ink);stroke:var(--paper);stroke-width:3}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,15,12,.72);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.letter{background:var(--paper-3);background-image:linear-gradient(transparent 0 calc(100% - 1px),rgba(180,156,114,.25) 0);background-size:100% 30px;width:100%;max-width:640px;padding:clamp(18px,4vw,36px);box-shadow:0 24px 60px rgba(0,0,0,.55);position:relative;border-radius:2px;max-height:calc(100vh - 32px);overflow-y:auto}
.letter .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.letter h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,34px);margin:0;line-height:1.1}
.letter .stampdate{font-family:var(--f-ui);font-weight:700;color:var(--seal);border:2px solid var(--seal);padding:2px 8px;transform:rotate(-5deg);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.npc{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.npc .face{width:46px;height:46px;border-radius:50%;background:var(--paper-2);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex-shrink:0}
.npc b{display:block;font-family:var(--f-ui);font-size:15px}
.npc small{font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)}
.speech{margin:0 0 12px;font-size:18px;line-height:1.6}
.speech::before{content:"״";color:var(--seal);font-family:var(--f-display);margin-inline-end:2px}
.ask{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.3;margin:20px 0 12px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:right;background:var(--paper);border:1px solid var(--rule);padding:11px 14px;cursor:pointer;font-family:var(--f-body);font-size:17px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--ink);background:#fff7e4}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--paper-3)}
.opt.wrong{background:var(--seal);border-color:var(--seal);color:var(--paper-3)}
.result{margin-top:14px;padding:12px 14px;background:var(--paper-2);border-inline-start:4px solid var(--ink);font-size:16px}
.result strong{font-family:var(--f-ui)}
.card-got{margin-top:14px;border:2px dashed var(--seal);padding:12px 14px;background:var(--paper)}
.card-got .eyebrow{color:var(--seal)}
.card-got b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block;margin:2px 0 4px}
.card-got p{margin:0;font-size:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* sorting */
.sort{display:grid;gap:8px;margin-top:8px}
.sort-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);padding:10px 12px}
.sort-row .t{flex:1;min-width:160px;font-size:17px}
.sort-row .pick{display:flex;gap:6px}
.sort-row button{font-family:var(--f-ui);font-size:14px;font-weight:500;border:1px solid var(--ink);background:transparent;padding:6px 12px;cursor:pointer}
.sort-row button:disabled{cursor:default}
.sort-row.ok{border-color:var(--ok);box-shadow:inset -5px 0 0 var(--ok)}
.sort-row.bad{border-color:var(--seal);box-shadow:inset -5px 0 0 var(--seal)}
.sort-row .note{flex-basis:100%;font-size:14px;color:var(--ink-soft)}

/* notebook */
.nb-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.nb-list li{border-bottom:1px solid var(--rule);padding-bottom:10px}
.nb-list b{font-family:var(--f-display);font-weight:400;font-size:20px}
.nb-list p{margin:2px 0 0;font-size:15px}
.nb-list .ex{color:var(--ink-soft)}
.nb-list li.locked b{color:var(--rule)}
.nb-list li.locked p{color:var(--rule);font-family:var(--f-ui);font-size:13px}

/* ending */
.rank{display:inline-block;font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;border:3px solid var(--seal);color:var(--seal);padding:6px 14px;transform:rotate(-3deg);margin:6px 0 14px}
/* small screens: the map scales down, so map text and pins scale up */
@media (max-width:820px){
  .city text{font-size:28px;stroke-width:7px}
  .country{font-size:28px}
  .sea{font-size:24px}
  .city .pin,.city .ring{r:18px}
  .city .hit{r:48px}
}
@media (max-width:560px){
  body{padding-block:12px 28px}
  .city text{font-size:36px;stroke-width:9px}
  .country{font-size:32px;letter-spacing:.08em}
  .sea{display:none}
  .city .pin,.city .ring{r:22px}
  .city .check{transform:scale(1.6)}
  .hud{gap:8px 12px;padding:8px 10px}
  .who{flex:1 1 100%}
  .nb-btn{margin-inline-start:auto}
  .who b{font-size:17px}
  .date{font-size:13px;padding:2px 8px}
  .cred span{display:none}
  .side{padding:14px}
  .side h3{font-size:21px}
  .letter{padding:18px 16px}
  .speech{font-size:17px}
  .ask{font-size:19px}
  .start .lead{font-size:16px}
}
@media (min-width:1400px){.wrap{max-width:1240px}.board{grid-template-columns:minmax(0,1fr) 340px}}
.credit{font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;color:var(--paper-2);opacity:.8;text-align:center;margin:18px 0 0}
@media (prefers-reduced-motion:reduce){.token{transition:none}.city.next .ring{animation:none;opacity:1}}
</style>

<div class="wrap" dir="rtl" lang="he">
  <!-- start screen -->
  <section class="start" id="start">
    <div class="eyebrow">סודי · אירופה · קיץ 1914</div>
    <h1>תיק מודיעין 1914</h1>
    <p class="lead">יורש העצר של אוסטרו-הונגריה עומד להגיע לסרייבו. בעוד 37 ימים כל אירופה תהיה במלחמה. הדמות שלך תיסע ברכבת בין בירות אירופה, תפגוש אנשים, תקבל החלטות ותאסוף ליומן את 10 המושגים שמסבירים איך זה קרה.</p>
    <h2>בחירת דמות</h2>
    <div class="roles" id="roles"></div>
    <div class="namebox">
      <label for="pname">שם הדמות
        <input id="pname" maxlength="20" placeholder="למשל: אלכס ברג" autocomplete="off">
      </label>
      <button class="btn seal" id="go" disabled>יציאה לדרך</button>
    </div>
  </section>

  <!-- game -->
  <section id="game" hidden>
    <div class="hud">
      <div class="who"><div class="medal" id="hudMedal"></div><div style="min-width:0"><b id="hudName"></b><small id="hudRole"></small></div></div>
      <div class="date" id="hudDate"></div>
      <div class="cred" id="hudCred" aria-label="אמינות"></div>
      <button class="nb-btn" id="nbBtn"></button>
    </div>
    <div class="board">
      <div class="map"><svg id="map" viewBox="0 0 1000 700" role="img" aria-label="מפת מסילות הרכבת של אירופה, 1914"></svg></div>
      <aside class="side">
        <div class="eyebrow" id="sideEyebrow">היעד הבא</div>
        <h3 id="sideTitle"></h3>
        <p id="sideText"></p>
        <ul class="log" id="log"></ul>
      </aside>
    </div>
  </section>

  <p class="credit">נוצר על ידי גיא גולדנברג</p>

  <div class="overlay" id="overlay" hidden><div class="letter" id="letter" role="dialog" aria-modal="true"></div></div>
</div>

<script>
/* ---------- data ---------- */
const ICONS = {
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="#efe2c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="#efe2c4" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  env:'<svg viewBox="0 0 24 24" fill="none" stroke="#efe2c4" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13"/><path d="M3 6l9 7 9-7"/></svg>'
};
const ROLES = [
  {id:"pen", name:"כתב/ת עיתון", desc:"העורך שלח אותך לסקר ביקור מלכותי בסרייבו. הכתבה עומדת להפוך לסיפור של המאה.", intro:"העורך ביקש כתבה קטנה על ביקור מלכותי. עכשיו יש לך את הסיפור הגדול ביותר באירופה, וצריך להבין אותו עד הסוף."},
  {id:"eye", name:"סוכן/ת מודיעין", desc:"המטה שלח אותך לעקוב אחרי המתיחות בבלקן ולדווח מה באמת קורה.", intro:"המטה צריך דוח: למה אירופה עומדת להתפוצץ, ומי יילחם במי. כל מקור שנפגוש הוא פיסה בפאזל."},
  {id:"env", name:"שליח/ה דיפלומטי/ת", desc:"משרד החוץ שלח אותך לסיור בבירות אירופה כדי להבין מי מחויב למי.", intro:"התיק הדיפלומטי שלך מלא במכתבי המלצה. המשימה: להבין את רשת ההתחייבויות בין המעצמות, לפני שיהיה מאוחר מדי."}
];

const CONCEPTS = {
  murder:{t:"רצח פוליטי", d:"רצח של אישיות ציבורית או פוליטית ממניעים פוליטיים או לאומיים.", e:"רצח יורש העצר פרנץ פרדיננד בסרייבו, 28.6.1914."},
  milall:{t:"ברית צבאית", d:"הסכם שמחייב מדינות לסייע זו לזו בכוח צבאי, בדרך כלל כשאחת מהן מותקפת.", e:"גרמניה התחייבה לעמוד לצד אוסטרו-הונגריה."},
  ultim:{t:"אולטימטום", d:"דרישה אחרונה עם הגבלת זמן, ואיום בצעד חמור כמו מלחמה אם היא לא תתקבל.", e:"האולטימטום של אוסטרו-הונגריה לסרביה, 23.7.1914, ל-48 שעות."},
  system:{t:"מערכת בריתות", d:"רשת הבריתות שחילקה את אירופה לשני מחנות. בגללה סכסוך מקומי גרר את כל המעצמות למלחמה.", e:"רוסיה התגייסה לטובת סרביה, וגרמניה הכריזה מלחמה על רוסיה ועל צרפת."},
  arms:{t:"מרוץ החימוש", d:"תחרות בין המעצמות על הגדלת הצבאות ופיתוח כלי נשק, מתוך פחד ושאיפה לעליונות.", e:"התחרות הימית בין בריטניה לגרמניה על ספינות קרב מסוג דרדנוט."},
  triple:{t:"הברית המשולשת", d:"ברית צבאית מ-1882 בין גרמניה, אוסטרו-הונגריה ואיטליה.", e:"ב-1914 איטליה הכריזה על ניטרליות, וב-1915 עברה לצד השני."},
  diplo:{t:"הסכמה מדינית", d:"הבנה בין מדינות שמיישבת סכסוכים ויוצרת שיתוף פעולה, בלי התחייבות צבאית מחייבת.", e:"ההסכמה הלבבית בין צרפת לבריטניה, 1904."},

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function drawMap(){
  const svg = $("#map"); svg.innerHTML = "";
  for (let x = 50; x < 1000; x += 100) el("line", {x1:x, y1:0, x2:x - 40, y2:700, class:"grat"}, svg);
  for (let y = 60; y < 700; y += 100) el("path", {d:`M0 ${y} Q500 ${y - 30} 1000 ${y}`, class:"grat", fill:"none"}, svg);

    el("path", {d, class:"ties", id:"ties-" + i}, rails);

    const labelBelow = ["sar","rom","par","vie"].includes(c.id);
    const t = el("text", {y: labelBelow ? 40 : -24, "text-anchor":"middle"}, g); t.textContent = c.name;

/* the token grows on narrow screens so it stays visible on a scaled-down map */
const tokScale = () => innerWidth <= 560 ? 1.7 : innerWidth <= 820 ? 1.35 : 1;
function tokAt(x, y){ const k = tokScale(); return `translate(${x + 22 * k}px,${y + 18 * k}px) scale(${k})`; }
function placeToken(instant){
  const tok = $("#token");
  let x, y;
  if (S.step === 0) { x = 740; y = 620; } else { const c = CITIES[Math.min(S.step, CITIES.length) - 1]; x = c.x; y = c.y; }
  if (instant) { tok.style.transition = "none"; tok.style.transform = tokAt(x, y); tok.getBoundingClientRect(); tok.style.transition = ""; }
  else tok.style.transform = tokAt(x, y);
}
addEventListener("resize", () => { if ($("#token")) placeToken(true); });
function refreshMap(){
  CITIES.forEach((c, i) => {
    const g = $("#city-" + c.id);
    g.classList.toggle("visited", i < S.step);
    const isNext = i === S.step;
    g.classList.toggle("next", isNext);
    if (isNext) { g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", "נסיעה ל" + c.name); }
    else { g.removeAttribute("tabindex"); g.removeAttribute("role"); g.removeAttribute("aria-label"); }

    ["rail-","ties-"].forEach(p => $("#" + p + i).classList.toggle("future", i >= S.step));
  }
}

function travel(i){
  if (i !== S.step || moving || S.step >= CITIES.length) return;

let afterClose = null;
function openLetter(html, bind){ $("#letter").innerHTML = html; $("#overlay").hidden = false; $("#letter").scrollTop = 0; if (bind) bind(); }

function scene(c){
  let shown = 1;
  const opts = shuffle(c.o.map((t, k) => ({t, ok: k === 0})));
  const render = () => {
    const done = shown >= c.lines.length;
    openLetter(`<div class="top"><div><div class="eyebrow">תחנה ${S.step + 1} מתוך ${CITIES.length}</div><h2>${c.name}</h2></div><span class="stampdate">${c.date}</span></div>

      ${c.lines.slice(0, shown).map(l => `<p class="speech">${l}</p>`).join("")}
      ${done ? `<p class="ask">${c.q}</p><div class="opts">${opts.map((o, k) => `<button class="opt" id="opt-${k}" data-k="${k}">${o.t}</button>`).join("")}</div><div id="res"></div>`
             : `<div class="actions"><button class="btn" id="more">המשך</button></div>`}`, () => {

  if (!ok) { btns[k].classList.add("wrong"); S.cred--; }
  gain(c.concept);
  S.log.push({d:c.date.replace(".1914",""), t:c.name + (ok ? " · דווח נכון" : " · טעות בדוח")});
  hud();
  const con = CONCEPTS[c.concept];
  const dead = S.cred <= 0;
  $("#res").innerHTML = `<div class="result"><strong>${ok ? "דוח מדויק." : "טעות. המטה מאבד מעט אמון."}</strong> ${c.ex}</div>
    <div class="card-got"><div class="eyebrow">נוסף ליומן</div><b>${con.t}</b><p>${con.d}</p></div>
    <div class="actions"><button class="btn seal" id="cont">${dead ? "המשך" : (S.step === CITIES.length - 1 ? "לדוח המסכם" : "חזרה לרכבת")}</button></div>`;
  $("#cont").addEventListener("click", () => {
    S.step++;
    if (dead) return gameOver();
    afterClose = () => { refreshMap(); side(); };
    closeLetter();
    if (S.step >= CITIES.length) report();
  });
  $("#cont").focus();
}
function gain(id){ if (!S.got.includes(id)) S.got.push(id); }

/* ---------- final report ---------- */
function report(){
  const picks = {};
  let mistakes = 0;
  const render = () => {
    const all = SORT.every((_, i) => picks[i]);
    openLetter(`<div class="top"><div><div class="eyebrow">המשימה האחרונה</div><h2>הדוח המסכם</h2></div><span class="stampdate">5.8.1914</span></div>
      <p>המטה רוצה לדעת מה גרם למלחמה. כל גורם ברשימה הוא <b>ישיר</b> (האירוע שהצית את המלחמה) או <b>עקיף</b> (תהליך ארוך שהכין את הקרקע). צריך לסווג כל אחד.</p>
      <div class="sort">${SORT.map((s, i) => {
        const p = picks[i], cls = p ? (p === s.a ? "ok" : "bad") : "";
        return `<div class="sort-row ${cls}"><span class="t">${s.t}</span><span class="pick">
          <button id="s-${i}-d" data-i="${i}" data-a="d" ${p ? "disabled" : ""}>ישיר</button>
          <button id="s-${i}-i" data-i="${i}" data-a="i" ${p ? "disabled" : ""}>עקיף</button></span>
          ${p ? `<span class="note">${p === s.a ? "נכון." : "לא נכון."} ${s.a === "d" ? "גורם ישיר" : "גורם עקיף"}: ${s.n}</span>` : ""}</div>`;
      }).join("")}</div>
      ${all ? `<div class="card-got"><div class="eyebrow">נוספו ליומן</div><b>גורם ישיר · גורם עקיף</b><p>${CONCEPTS.direct.d}</p><p style="margin-top:6px">${CONCEPTS.indirect.d}</p></div>
        <div class="actions"><button class="btn seal" id="fin">${S.cred <= 0 ? "המשך" : "הגשת הדוח"}</button></div>` : ""}`, () => {
      document.querySelectorAll(".sort-row button:not(:disabled)").forEach(b => b.addEventListener("click", () => {
        const i = +b.dataset.i; picks[i] = b.dataset.a;
        if (picks[i] !== SORT[i].a) { S.cred--; mistakes++; }
        if (SORT.every((_, j) => picks[j])) { gain("direct"); gain("indirect"); }
        hud(); render();
        const f = $("#fin") || document.querySelector(".sort-row button:not(:disabled)"); if (f) f.focus();
      }));
      if ($("#fin")) $("#fin").addEventListener("click", () => S.cred <= 0 ? gameOver() : ending());
    });
  };
  $("#letter").dataset.closable = "0";
  render();
}

/* ---------- endings ---------- */
function notebookHTML(){
  return `<ul class="nb-list">${ORDER.map(id => {
    const c = CONCEPTS[id], has = S.got.includes(id);
    return has ? `<li><b>${c.t}</b><p>${c.d}</p><p class="ex">דוגמה: ${c.e}</p></li>`
               : `<li class="locked"><b>${"▒".repeat(5)}</b><p>עוד לא נאסף. ממשיכים במסלול.</p></li>`;
  }).join("")}</ul>`;
}
function ending(){
  const r = S.cred === 3 ? "סוכן/ת בכיר/ה · דוח מושלם" : S.cred === 2 ? "דוח מצוין" : "הדוח הוגש, בקושי";
  openLetter(`<div class="top"><div><div class="eyebrow">המשימה הושלמה</div><h2>הדוח של ${esc(S.name)}</h2></div><span class="stampdate">5.8.1914</span></div>
    <div class="rank">${r}</div>
    <p>בתוך 37 ימים רצח פוליטי אחד בסרייבו, אולטימטום ומערכת בריתות גררו את כל המעצמות למלחמה. אלה 10 המושגים שאספת בדרך:</p>
    ${notebookHTML()}
    <p class="eyebrow" style="margin-top:16px">נוצר על ידי גיא גולדנברג</p>
    <div class="actions"><button class="btn seal" id="again">משחק חדש</button></div>`, () => {
    $("#again").addEventListener("click", restart); $("#again").focus();
  });
  $("#letter").dataset.closable = "0";
}
function gameOver(){
  openLetter(`<div class="top"><div><div class="eyebrow">הודעה מהמטה</div><h2>הודחת מהמשימה</h2></div><span class="stampdate">מברק</span></div>
    <p class="speech">יותר מדי טעויות בדוחות. המטה מחזיר את ${esc(S.name)} הביתה.</p>
    <p>כדאי לעבור על היומן ולנסות שוב. המושגים שכבר נאספו:</p>
    ${notebookHTML()}
    <div class="actions"><button class="btn seal" id="again">ניסיון נוסף</button></div>`, () => {
    $("#again").addEventListener("click", restart); $("#again").focus();
  });
  $("#letter").dataset.closable = "0";
}
function restart(){ $("#overlay").hidden = true; begin(); }

/* ---------- notebook ---------- */
$("#nbBtn").addEventListener("click", () => {
  openLetter(`<div class="top"><div><div class="eyebrow">${esc(S.name)} · ${S.role.name}</div><h2>היומן</h2></div><span class="stampdate">${S.got.length}/10</span></div>
    ${notebookHTML()}
    <div class="actions"><button class="btn" id="close">סגירת היומן</button></div>`, () => { $("#close").addEventListener("click", closeLetter); $("#close").focus(); });
  $("#letter").dataset.closable = "1";
});
</script>

</html>
